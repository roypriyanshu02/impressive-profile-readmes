name: Bug report
description: Report a bug, gallery crash, broken link, or screenshot failure
title: "[BUG] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        > **Note:** To remove or update a GitHub profile entry, please submit a [Pull Request](https://github.com/roypriyanshu02/awesome-github-profile-readme/blob/main/CONTRIBUTING.md#profile-entries-add-remove-update) directly instead of opening a bug report.

  - type: textarea
    id: bug_description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is (e.g., live gallery filter crash, link checker script failure, broken screenshot).
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Provide relevant environment details.
      value: |
        - **Node.js Version:** (e.g., `node -v`)
        - **Browser:** (e.g., Chrome, Firefox, Safari, N/A)
        - **Operating System:** (e.g., macOS, Linux, Windows WSL)
        - **Affected Component:** (e.g., Live Gallery `site/`, Screenshot Script, Link Checker CI, README List)
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps or commands to reproduce the behavior.
      value: |
        1. Command executed (e.g., `npm run dev` in `site/`) or link clicked:
        2. Errors or console output (please wrap in code blocks):
        3. Profile entry or category affected (if relevant):
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (e.g., screenshots, console logs, or PR references).
    validations:
      required: false
